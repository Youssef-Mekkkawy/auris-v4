<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>Auris — Design Exploration</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a10; color: #e2e8f0; font-family: 'Cairo', sans-serif; }
  body { min-height: 100vh; }
  .dc-canvas-host { background: #0a0a10; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variations.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

const STATES = [
  { id: 'idle',      label: 'Idle · جاهز' },
  { id: 'ringing',   label: 'Ringing · جاري الاتصال' },
  { id: 'connected', label: 'Connected · متصل' },
  { id: 'ended',     label: 'Ended · انتهت' },
];

function Variations() {
  return (
    <DesignCanvas storageKey="auris-canvas">
      <DCSection
        id="glow"
        title="Vibe 1 · Glow / Glass"
        subtitle="Refines the current dark-purple direction with depth, breathing orb, dual-wave audio viz, glass surfaces."
      >
        {STATES.map(s => (
          <DCArtboard key={s.id} id={`glow-${s.id}`} label={s.label} width={460} height={720}>
            <GlowApp state={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection
        id="brutal"
        title="Vibe 2 · Brutalist Mono"
        subtitle="Terminal aesthetic — JetBrains Mono everywhere, ASCII waveform, bracketed status, hard borders."
      >
        {STATES.map(s => (
          <DCArtboard key={s.id} id={`brut-${s.id}`} label={s.label} width={460} height={720}>
            <BrutalApp state={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection
        id="editorial"
        title="Vibe 3 · Editorial Arabic"
        subtitle="Typography-led, Arabic display hero (أوريس), warm dark with saffron accent, magazine-style transcript."
      >
        {STATES.map(s => (
          <DCArtboard key={s.id} id={`ed-${s.id}`} label={s.label} width={460} height={720}>
            <EditorialApp state={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Variations/>);
</script>
</body>
</html>
