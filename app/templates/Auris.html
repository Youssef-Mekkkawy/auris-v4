<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auris</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.10.0/dist/twilio.min.js"></script>

<style>
/* ─────────────────────────────────────────────────────────────
   AURIS · Single-card voice bot — Glow / Glass
   • RTL Arabic-first, responsive, centered
   • Mic-reactive orb during the live call
   • Preserves: device, activeCall, timerInterval, seconds,
                setStatus, showButtons, startTimer, stopTimer,
                startCall, answerCall, cancelCall, hangup, onDisconnect
   ───────────────────────────────────────────────────────────── */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #04040e;
  --surface: rgba(13,13,26,.55);
  --line: rgba(255,255,255,.06);
  --text: #e2e8f0;
  --muted: #6a6a8a;
  --accent: #7c72ff;
  --accent-2: #00d4ff;
  --good: #28c840;
  --warn: #febc2e;
  --bad: #ff5f57;
}

html, body {
  width: 100%; min-height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Cairo', 'Tajawal', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Stage */
.stage {
  width: 100%; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding: clamp(16px, 4vw, 32px);
  background: radial-gradient(ellipse at 50% 0%, #0a0a18 0%, #04040e 60%, #02020a 100%);
}
.stage::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 15% 20%, rgba(124,114,255,.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(0,212,255,.12), transparent 45%);
  filter: blur(40px);
  animation: drift 18s ease-in-out infinite;
}
@keyframes drift {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(20px,-30px) scale(1.1); }
}

/* Card */
.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column;
  align-items: stretch;
  padding: clamp(28px, 6vw, 40px) clamp(24px, 5vw, 36px) clamp(28px, 5vw, 36px);
  gap: clamp(18px, 3vw, 22px);
  border-radius: 24px;
  border: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(17,17,30,.85), rgba(13,13,26,.7)),
    radial-gradient(circle at 50% 0%, rgba(124,114,255,.15), transparent 60%);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.02),
    0 30px 80px -20px rgba(0,0,0,.7),
    0 60px 120px -40px rgba(124,114,255,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
  text-align: center;
}

/* Brand */
.brand {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: 2.5px; text-transform: uppercase;
}
.brand-mark {
  font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 17px;
  background: linear-gradient(135deg, #fff, #b5acff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: -.3px; text-transform: none;
}
.brand-divider { width: 1px; height: 12px; background: var(--line); }

/* Orb hero */
.orb-wrap { display: flex; align-items: center; justify-content: center; padding: 6px 0 2px; }
.orb {
  --c1: #3a3a5a; --c2: #1a1a2e; --level: 0;
  width: 150px; height: 150px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  transition: filter .6s;
}
.orb.idle      { --c1: #3a3a5a; --c2: #1a1a2e; }
.orb.calling   { --c1: #7c72ff; --c2: #00d4ff; }
.orb.ringing   { --c1: #febc2e; --c2: #7c4a0e; }
.orb.connected { --c1: #28c840; --c2: #0e6018; }
.orb.error     { --c1: #ff5f57; --c2: #3a1010; }
.orb-core {
  position: absolute; inset: 30%;
  background: radial-gradient(circle, var(--c1), var(--c2));
  border-radius: 50%; filter: blur(2px);
  box-shadow: 0 0 60px var(--c1), inset 0 0 30px rgba(255,255,255,.2);
  transform: scale(calc(1 + var(--level) * 0.45));
  transition: transform .12s ease-out;
}
.orb-ring {
  position: absolute; inset: 0;
  border: 1px solid var(--c1);
  border-radius: 50%; opacity: 0;
}
.orb.calling .orb-ring,
.orb.ringing .orb-ring,
.orb.connected .orb-ring { animation: orbExpand 3s ease-out infinite; opacity: 1; }
.orb.calling .orb-ring.r2,
.orb.ringing .orb-ring.r2,
.orb.connected .orb-ring.r2 { animation-delay: 1s; }
.orb.calling .orb-ring.r3,
.orb.ringing .orb-ring.r3,
.orb.connected .orb-ring.r3 { animation-delay: 2s; }
.orb.calling .orb-core,
.orb.ringing .orb-core { animation: orbBreathe 2.4s ease-in-out infinite; }
@keyframes orbExpand {
  0%   { transform: scale(.55); opacity: .8; }
  100% { transform: scale(1.55); opacity: 0; }
}
@keyframes orbBreathe {
  0%,100% { transform: scale(1);   filter: blur(2px); }
  50%     { transform: scale(1.08); filter: blur(4px); }
}
.orb-glyph {
  position: relative; z-index: 2;
  font-size: 32px; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,.6);
}

/* Title */
.title-block { display: flex; flex-direction: column; gap: 6px; }
.title {
  font-family: 'Cairo', sans-serif; font-weight: 800;
  font-size: 24px; color: #fff; letter-spacing: -.3px;
}
.subtitle {
  font-family: 'Cairo', sans-serif; font-size: 13px;
  color: var(--muted); line-height: 1.5;
}

/* Status pill */
.status {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 12px 18px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  font-size: 14px; font-weight: 600;
  color: var(--muted); min-height: 48px;
  transition: all .3s;
}
.status.calling   { border-color: rgba(124,114,255,.35); color: #b5acff;
                    box-shadow: 0 0 24px -8px rgba(124,114,255,.4); }
.status.ringing   { border-color: rgba(254,188,46,.35); color: var(--warn);
                    box-shadow: 0 0 24px -8px rgba(254,188,46,.4); }
.status.connected { border-color: rgba(40,200,64,.35); color: var(--good);
                    box-shadow: 0 0 24px -8px rgba(40,200,64,.4); }
.status.error     { border-color: rgba(255,95,87,.35); color: var(--bad);
                    box-shadow: 0 0 24px -8px rgba(255,95,87,.3); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.dot.pulse { animation: dotPulse 1.5s infinite; }
@keyframes dotPulse {
  0%,100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50%     { opacity: .5; box-shadow: 0 0 0 6px transparent; }
}

/* Timer */
.timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px; font-weight: 700;
  color: var(--accent-2);
  letter-spacing: 2px;
  display: none;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 24px rgba(0,212,255,.4);
}
.timer.visible { display: block; }

/* Waveform (gradient bars) */
.waveform {
  display: none;
  align-items: center; justify-content: center;
  gap: 4px; height: 44px;
}
.waveform.visible { display: flex; }
.waveform span {
  display: block; width: 4px; border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  animation: wave 1.2s ease-in-out infinite;
  box-shadow: 0 0 8px rgba(124,114,255,.4);
}
.waveform span:nth-child(1){height:12px;animation-delay:0s}
.waveform span:nth-child(2){height:22px;animation-delay:.1s}
.waveform span:nth-child(3){height:36px;animation-delay:.2s}
.waveform span:nth-child(4){height:44px;animation-delay:.3s}
.waveform span:nth-child(5){height:36px;animation-delay:.25s}
.waveform span:nth-child(6){height:22px;animation-delay:.15s}
.waveform span:nth-child(7){height:12px;animation-delay:.05s}
@keyframes wave {
  0%,100% { transform: scaleY(.3); opacity: .5; }
  50%     { transform: scaleY(1);  opacity: 1;  }
}

/* Buttons */
.btn-group { display: flex; gap: 10px; }
.btn {
  flex: 1; position: relative;
  padding: 14px 18px;
  border-radius: 14px; border: 1px solid transparent;
  cursor: pointer;
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s, box-shadow .25s, opacity .2s;
  color: #fff; overflow: hidden;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-call {
  background: linear-gradient(135deg, var(--accent), #5b4eff);
  box-shadow: 0 8px 24px rgba(124,114,255,.4),
              inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-answer {
  background: linear-gradient(135deg, var(--good), #1aa830);
  box-shadow: 0 8px 24px rgba(40,200,64,.4),
              inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-cancel {
  background: linear-gradient(135deg, var(--bad), #cc3a32);
  box-shadow: 0 8px 24px rgba(255,95,87,.3),
              inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-en {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 1.5px; opacity: .8;
}
.btn-ring {
  position: absolute; inset: -4px;
  border: 2px solid currentColor;
  border-radius: 18px; pointer-events: none; opacity: 0;
}
.btn[data-pulse="true"] .btn-ring { opacity: 1; animation: btnRing 1.6s ease-out infinite; }
@keyframes btnRing {
  0%   { transform: scale(.85); opacity: .6; }
  100% { transform: scale(1.15); opacity: 0; }
}

.hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: #2a2a3e;
  letter-spacing: 1px;
}
.hint span { color: var(--muted); }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">

    <div class="brand">
      <span class="brand-mark">أوريس</span>
      <span class="brand-divider"></span>
      <span>AI VOICE AGENT</span>
    </div>

    <div class="orb-wrap">
      <div class="orb idle" id="orb">
        <div class="orb-core"></div>
        <div class="orb-ring r1"></div>
        <div class="orb-ring r2"></div>
        <div class="orb-ring r3"></div>
        <div class="orb-glyph" id="orbGlyph">🤖</div>
      </div>
    </div>

    <div class="title-block">
      <div class="title">Auris</div>
      <div class="subtitle">ذكاء اصطناعي يتكلّم بالمصري</div>
    </div>

    <div class="status" id="status">
      <div class="dot"></div>
      <span>اضغط الزر للبدء</span>
    </div>

    <div class="timer" id="timer">0:00</div>

    <div class="waveform" id="waveform">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <div class="btn-group" id="btnGroup">
      <button class="btn btn-call" style="width:100%" onclick="startCall()">
        <span>اتصل مع Auris</span>
        <span class="btn-en">CALL ME</span>
      </button>
    </div>

    <div class="hint">
      اسمح بالميكروفون عند الطلب ·
      <span>allow mic when prompted</span>
    </div>
  </div>
</div>

<script>
let device, activeCall, timerInterval, seconds = 0;
let audioCtx, analyser, micStream, rafLevel;

// ── Status (drives orb visual + status pill) ───────────────
function setStatus(text, type = '') {
  const el  = document.getElementById('status');
  const orb = document.getElementById('orb');
  const glyph = document.getElementById('orbGlyph');

  el.className = 'status ' + type;
  const dot = (type && type !== 'error') ? '<div class="dot pulse"></div>' : '<div class="dot"></div>';
  el.innerHTML = dot + '<span>' + text + '</span>';

  orb.className = 'orb ' + (type || 'idle');
  glyph.textContent =
    type === 'connected' ? '●' :
    type === 'ringing'   ? '📞' :
    type === 'error'     ? '✕' :
    type === 'calling'   ? '🤖' : '🤖';
}

function showButtons(html) { document.getElementById('btnGroup').innerHTML = html; }

// ── Timer ──────────────────────────────────────────────────
function startTimer() {
  seconds = 0;
  const el = document.getElementById('timer');
  el.classList.add('visible');
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    el.textContent = m + ':' + s.toString().padStart(2,'0');
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer').classList.remove('visible');
}

// ── Mic-reactive orb ───────────────────────────────────────
async function startMicLevel() {
  if (audioCtx) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const orb = document.getElementById('orb');
    let smooth = 0;
    const tick = () => {
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = (buf[i] - 128) / 128; sum += v * v;
      }
      const rms = Math.sqrt(sum / buf.length);
      const lvl = Math.min(1, rms * 3.5);
      smooth = smooth * 0.7 + lvl * 0.3;
      orb.style.setProperty('--level', smooth.toFixed(3));
      rafLevel = requestAnimationFrame(tick);
    };
    tick();
  } catch (err) { console.warn('mic level unavailable:', err && err.message); }
}
function stopMicLevel() {
  cancelAnimationFrame(rafLevel);
  if (audioCtx)   { try { audioCtx.close(); } catch(_){} audioCtx = null; }
  if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const orb = document.getElementById('orb');
  if (orb) orb.style.setProperty('--level', '0');
}

// ── Call flow (preserved verbatim) ─────────────────────────
async function startCall() {
  setStatus('جاري الاتصال...', 'calling');
  showButtons(
    '<button class="btn btn-call" style="width:100%" disabled>' +
      '<span>جاري الاتصال...</span><span class="btn-en">CONNECTING</span>' +
    '</button>'
  );
  try {
    const res  = await fetch('/token');
    const data = await res.json();
    device = new Twilio.Device(data.token, { logLevel: 1 });

    device.on('incoming', call => {
      activeCall = call;
      document.getElementById('card').classList.add('ringing');
      setStatus('📳 مكالمة واردة من Auris...', 'ringing');
      showButtons(
        '<button class="btn btn-answer" data-pulse="true" onclick="answerCall()">' +
          '<span class="btn-ring"></span>' +
          '<span>رد</span><span class="btn-en">ANSWER</span>' +
        '</button>' +
        '<button class="btn btn-cancel" onclick="cancelCall()">' +
          '<span>رفض</span><span class="btn-en">REJECT</span>' +
        '</button>'
      );
      call.on('disconnect', onDisconnect);
    });
    device.on('error', err => {
      setStatus('❌ ' + err.message, 'error');
      showButtons(
        '<button class="btn btn-call" style="width:100%" onclick="startCall()">' +
          '<span>اتصل مع Auris</span><span class="btn-en">CALL ME</span>' +
        '</button>'
      );
    });
    await device.register();
    await fetch('/make-call');
    setStatus('⏳ انتظر مكالمة Auris...', 'calling');
  } catch (err) {
    setStatus('❌ ' + err.message, 'error');
    showButtons(
      '<button class="btn btn-call" style="width:100%" onclick="startCall()">' +
        '<span>اتصل مع Auris</span><span class="btn-en">CALL ME</span>' +
      '</button>'
    );
  }
}

function answerCall() {
  if (!activeCall) return;
  activeCall.accept();
  document.getElementById('card').classList.remove('ringing');
  setStatus('🟢 متصل مع Auris — اتكلم!', 'connected');
  document.getElementById('waveform').classList.add('visible');
  showButtons(
    '<button class="btn btn-cancel" style="width:100%" onclick="hangup()">' +
      '<span>إنهاء المكالمة</span><span class="btn-en">HANG UP</span>' +
    '</button>'
  );
  startTimer();
  startMicLevel();
}

function cancelCall() {
  if (activeCall) { activeCall.reject(); activeCall = null; }
  onDisconnect();
}

function hangup() {
  if (activeCall) { activeCall.disconnect(); activeCall = null; }
  onDisconnect();
}

function onDisconnect() {
  document.getElementById('card').classList.remove('ringing');
  document.getElementById('waveform').classList.remove('visible');
  stopTimer();
  stopMicLevel();
  setStatus('📵 انتهت المكالمة', '');
  showButtons(
    '<button class="btn btn-call" style="width:100%" onclick="startCall()">' +
      '<span>اتصل مع Auris</span><span class="btn-en">CALL ME</span>' +
    '</button>'
  );
  activeCall = null;
}
</script>
</body>
</html>
